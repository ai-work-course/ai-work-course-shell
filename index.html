<!doctype html>
<html lang="ko" data-brand="claude">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AI 활용 교육</title>
<link rel="stylesheet" href="shell/pages.css">
</head>
<body data-screen="login">
<main class="wrap narrow">
  <h1>AI 활용 교육</h1>
  <p class="lead">강사에게 받은 아이디로 로그인합니다.</p>
  <noscript><p class="msg err">이 화면은 JavaScript가 켜져 있어야 열립니다.</p></noscript>
  <p class="msg" id="status" role="status" hidden></p>
  <p id="guardLinks" hidden><a href="home.html">홈으로</a></p>
  <form id="f" hidden novalidate>
    <div class="field"><label for="uid">아이디</label><input id="uid" name="uid" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="20"></div>
    <div class="field"><label for="pw">비밀번호</label><input id="pw" name="pw" type="password" autocomplete="current-password"></div>
    <div class="row-btns"><button class="btn" id="go" type="submit">로그인</button></div>
  </form>
  <p class="hint">비밀번호를 잊었으면 강사에게 초기화를 요청합니다.</p>
</main>
<script src="shell/config.js"></script>
<script src="lib/supabase.js"></script>
<script src="shell/paths.js"></script>
<script src="shell/common.js"></script>
<script src="shell/login.js"></script>
</body>
</html>
