<!doctype html>
<html lang="ko" data-brand="claude">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>비밀번호 바꾸기 · AI 활용 교육</title>
<link rel="stylesheet" href="shell/pages.css">
</head>
<body data-screen="password">
<header class="bar"><a class="brand" href="home.html" aria-label="AI 활용 교육"><svg viewBox="0 0 32 32" aria-hidden="true"><rect class="mk-bg" width="32" height="32" rx="8"/><path class="mk-ink" d="M16 10.6c-2.3-1.7-5.1-2.3-8.2-1.9v12.7c3.1-.4 5.9.2 8.2 1.9 2.3-1.7 5.1-2.3 8.2-1.9V8.7c-3.1-.4-5.9.2-8.2 1.9zM16 10.6v12.7"/></svg><span class="brand-name"><b>AI 활용</b> <span class="lt">교육</span></span></a><nav class="nav" id="nav"></nav></header>
<main class="wrap narrow">
<div class="card-page">
  <h1>비밀번호 바꾸기</h1>
  <p class="msg" id="intro" hidden>처음 로그인했습니다. 강사에게 받은 비밀번호를 새 비밀번호로 바꿔야 교육 내용을 볼 수 있습니다.</p>
  <noscript><p class="msg err">이 화면은 JavaScript가 켜져 있어야 열립니다.</p></noscript>
  <p class="msg" id="status" role="status">불러오는 중입니다.</p>
  <form id="f" hidden novalidate>
    <div class="field"><label for="cur">지금 비밀번호</label><input id="cur" type="password" autocomplete="current-password"></div>
    <div class="field"><label for="new1">새 비밀번호</label><input id="new1" type="password" autocomplete="new-password"><p class="err" id="err" role="alert"></p></div>
    <div class="field"><label for="new2">새 비밀번호 확인</label><input id="new2" type="password" autocomplete="new-password"></div>
    <p class="hint">10자 이상, 영문과 숫자를 함께 씁니다. 아이디나 지금 비밀번호와 같으면 안 됩니다.</p>
    <div class="row-btns"><button class="btn" id="go" type="submit">바꾸기</button></div>
  </form>
  <p id="back" hidden><a href="me.html">마이페이지로 돌아가기</a></p>
</div>
</main>
<script src="shell/config.js"></script>
<script src="lib/supabase.js"></script>
<script src="shell/paths.js"></script>
<script src="shell/common.js"></script>
<script src="shell/password.js"></script>
</body>
</html>
