<!doctype html>
<html lang="ko" data-brand="claude">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>수강 · AI 활용 교육</title>
<link rel="stylesheet" href="shell/pages.css">
</head>
<body data-screen="learn">
<svg class="sprite" aria-hidden="true">
  <symbol id="i-mark" viewBox="0 0 32 32"><rect class="mk-bg" width="32" height="32" rx="8"/><path class="mk-ink" d="M16 10.6c-2.3-1.7-5.1-2.3-8.2-1.9v12.7c3.1-.4 5.9.2 8.2 1.9 2.3-1.7 5.1-2.3 8.2-1.9V8.7c-3.1-.4-5.9.2-8.2 1.9zM16 10.6v12.7"/></symbol>
  <symbol id="s-none" viewBox="0 0 24 24"><circle class="mk-ring" cx="12" cy="12" r="9"/></symbol>
  <symbol id="s-doing" viewBox="0 0 24 24"><circle class="mk-ring" cx="12" cy="12" r="9"/><path class="mk-half" d="M12 3a9 9 0 0 1 0 18z"/></symbol>
  <symbol id="s-done" viewBox="0 0 24 24"><circle class="mk-full" cx="12" cy="12" r="10"/><path class="mk-tick" d="m7.5 12.2 3 3 6-6.4"/></symbol>
  <symbol id="i-side" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
</svg>
<div class="learn overview" id="learn">
  <header class="lbar">
    <button class="icon-btn" id="listBtn" type="button" aria-controls="side" aria-expanded="true" aria-label="차시 목록 열기·닫기" hidden><svg class="ico" aria-hidden="true"><use href="#i-side"></use></svg></button>
    <a class="brand" href="home.html" aria-label="홈으로"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#i-mark"></use></svg></a>
    <div class="ltitle"><span class="lcourse" id="barCourse"></span><b id="barTitle"></b></div>
    <div class="lnav" id="barNav" hidden></div>
    <nav class="nav" id="nav"></nav>
  </header>
  <aside class="side" id="side" aria-label="차시 목록" hidden>
    <div class="side-head" id="sideHead"></div>
    <nav class="curr" id="curr" aria-label="단계별 차시"></nav>
    <div class="side-foot links" id="sideLinks"></div>
  </aside>
  <main class="main" id="main">
    <div class="main-in">
      <noscript><p class="msg err">이 화면은 JavaScript가 켜져 있어야 열립니다.</p></noscript>
      <p class="msg" id="status" role="status">불러오는 중입니다.</p>
      <p id="homeLink" hidden><a href="home.html">홈으로</a></p>
      <div class="stage-box" id="stage"></div>
      <section class="linfo" id="info" aria-labelledby="infoTitle" hidden>
        <div><p class="kicker" id="infoKicker"></p><h1 id="infoTitle"></h1><p class="goal" id="infoGoal"></p></div>
        <div class="lprog" id="infoProg"></div>
      </section>
      <div class="lcards" id="lcards" hidden>
        <section class="panel">
          <details class="files" id="files" open><summary>이 차시 실습자료</summary><div class="files-body">
            <p class="hint">받은 파일은 다운로드 폴더에 저장됩니다. 거기서 할 일에 적힌 폴더로 옮깁니다. 할 일이 옮기지 말라고 한 파일은 다운로드 폴더에서 바로 엽니다.</p>
            <p class="hint">이름에 <code>/</code>가 든 파일은 앞부분과 같은 이름의 폴더를 만들어 그 안에 둡니다.</p>
            <p class="files-state" role="status" hidden></p><div class="files-list"></div></div></details>
        </section>
        <section class="panel" aria-labelledby="keysTitle">
          <h2 id="keysTitle">조작 안내</h2>
          <ul class="keys">
            <li>방향키 <kbd>오른쪽</kbd> <kbd>Space</kbd> 다음 장</li>
            <li>방향키 <kbd>왼쪽</kbd> 앞 장</li>
            <li><kbd>B</kbd> 보충 설명</li>
            <li><kbd>N</kbd> 메모</li>
            <li><kbd>F</kbd> 전체 화면</li>
            <li class="wide">키가 듣지 않으면 차시 화면을 한 번 누릅니다.</li>
            <li class="wide">글자가 작으면 F 키로 전체 화면으로 봅니다.</li>
          </ul>
        </section>
      </div>
      <nav class="pager" id="pager" aria-label="이전·다음 차시" hidden></nav>
      <section id="overview" hidden></section>
    </div>
  </main>
</div>
<script src="shell/config.js"></script>
<script src="lib/supabase.js"></script>
<script src="shell/paths.js"></script>
<script src="shell/common.js"></script>
<script src="shell/learn.js"></script>
</body>
</html>
